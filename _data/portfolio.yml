- section: Other Linguistics Projects 
  entries:
   - title: "<em>Que, Pour L’amour de Dieu, Fait Quoi ?</em> Towards an Analysis of French Coordinated Wh-Questions"
     subtitle: "Paper for LING 315: Topics in Syntax at Carleton College (November 2024)"
     link: /assets/docs/coordinated_wh.pdf
     thumb: /assets/images/coordinated-wh-thumb.png
     thumb_alt: "Thumbnail for coordinated-wh paper"
     description: >
       In this paper, I argue that a bi-clausal non-bulk sharing structure can account for French coordinated wh-questions with non-subject [wh].
       I also discuss coordinated wh-questions with wh-subjects, which raise issues for both my analysis 
       and past analyses of French sluicing. 

   - title: "<em>Moi j'étudie la dislocation à gauche :</em> Le cas de <em>moi je</em> dans le corpus GREMO"
     subtitle: "Culminating project for semester abroad, completed at the <em>Linguistique, Langue, Parole</em> Lab of the University of Strasbourg (December 2023)"
     link: /assets/docs/memoire_moi-je.pdf
     thumb: /assets/images/memoire-moi-je-thumb.png
     thumb_alt: "Thumbnail for moi je paper"
     description: >
       This paper interrogates the syntactic status of <em>moi je</em> (me I) in Spoken French, specifically 
       investigating whether <em>moi je</em> is in the process of becoming a single morpheme. To this end, I 
       examine the prosody of <em>moi je</em> disfluencies in the University of Strasbourg's GREMO
       corpus. (Written in French)
     note: "This project was a finalist for the Forum on Education Abroad's national Award for Academic Achievement Abroad."

