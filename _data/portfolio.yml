- section: Other Linguistics Projects 
  entries:
   - title: "Que, Pour L’amour de Dieu, Fait Quoi ? Towards an Analysis of French Coordinated Wh-Questions"
     subtitle: "Paper for LING 315: Topics in Syntax at Carleton College (November 2024)"
     link: /assets/docs/coordinated_wh.pdf
     thumb: /assets/images/coordinated-wh-thumb.png
     thumb_alt: "Thumbnail for coordinated-wh paper"
     description: >
       In this paper, I argue that a bi-clausal non-bulk sharing structure can account for French coordinated wh-questions with non-subject [wh].
       I also discuss coordinated wh-questions with wh-subjects, which raise issues for both my analysis 
       and past analyses of French sluicing. 
    
