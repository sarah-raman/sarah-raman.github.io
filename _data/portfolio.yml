- section: Senior Thesis in Linguistics
  entries: 
   - title: "Assessing L2 sociolinguistic competence: a repetition task approach to /l/ deletion in L2 French"
     subtitle: "Senior thesis in Linguistics (March, 2025)"
     link: /assets/docs/comps_submission.pdf
     thumb: /assets/images/comps-thumb.png
     thumb_alt: Linguistics thesis thumbnail
     description: >  
        My senior thesis used a novel repetition task to assess advanced
        French learners' usage of variable /l/ deletion. I was particularly
        interested in the question: does a higher variable usage rate
        correlate with adherence to L1-like linguistic factor weights
        conditioning deletion, or are those two aspects of sociolinguistic
        competence acquired separately?
     note: "This project was awarded distinction by the Carleton College Department of Linguistics."

